<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in / Check-out</title>
<meta name="theme-color" content="#057962">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Check-in">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eef2f6; --ink:#14213d; --line:#c9d3df; --in:#057962; --out:#b26a00; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans Lao', system-ui, sans-serif; }
  main { max-width:420px; margin:0 auto; padding:20px 16px 40px; }
  .logo { display:block; width:78%; max-width:300px; height:auto; margin:4px 0 12px; }
  h1 { font-size:1.35rem; margin:8px 0 2px; }
  #clock { font-size:2.6rem; font-weight:700; letter-spacing:.02em; margin:0; }
  #date { margin:0 0 18px; color:#4a5a70; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input[type=text], input[type=email], input[type=password] { width:100%; padding:12px; font:inherit;
    border:1px solid var(--line); border-radius:8px; background:#fff; }
  select { width:100%; padding:12px; font:inherit; border:1px solid var(--line);
    border-radius:8px; background:#fff; color:var(--ink); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  #shot { display:none; }
  #shotBtn { width:100%; padding:14px; font:inherit; font-weight:600; border:2px dashed var(--line);
    border-radius:8px; background:#fff; color:var(--ink); }
  #preview { display:none; width:100%; max-height:240px; object-fit:cover; border-radius:8px; margin-top:8px; }
  .actions { display:flex; gap:10px; margin-top:20px; }
  .actions button { flex:1; padding:16px 8px; font:inherit; font-size:1.05rem; font-weight:700;
    color:#fff; border:0; border-radius:10px; }
  #btnIn { background:var(--in); } #btnOut { background:var(--out); }
  #btnLeave { background:#5b6b8a; }
  .actions.second { margin-top:10px; }
  button:disabled { opacity:.5; }
  button:focus-visible, input:focus-visible { outline:3px solid #ffb703; outline-offset:2px; }
  #adminToggle { background:none; border:0; color:#4a5a70; text-decoration:underline; font:inherit; margin-top:28px; padding:6px 0; }
  #admin { display:none; margin-top:10px; padding:14px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .item { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .item span { flex:1; overflow-wrap:anywhere; }
  .del { padding:8px 12px; border:1.5px solid var(--err); color:var(--err); background:#fff; border-radius:8px; font:inherit; font-weight:600; }
  #admin h2 { font-size:1.05rem; margin:18px 0 0; }
  .btn2 { width:100%; padding:12px; margin-top:10px; font:inherit; font-weight:600; color:var(--ink);
    background:#fff; border:1.5px solid var(--ink); border-radius:8px; }
  #leave { display:none; margin-top:14px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .cal-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .calnav { width:44px; height:44px; font-size:1.4rem; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .wd { text-align:center; font-size:.8rem; color:#4a5a70; padding:4px 0; }
  .day { height:42px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font:inherit; }
  .day.today { border:2px solid var(--ink); }
  .day.sel { background:var(--in); color:#fff; border-color:var(--in); }
  .day.booked { background:#2f6fb0; color:#fff; border-color:#2f6fb0; }
  .day:disabled { opacity:.35; }
  #leaveInfo { margin:10px 0 0; line-height:1.5; }
  .legend { font-size:.85rem; color:#4a5a70; margin:4px 0 0; }
  #map { height:260px; margin-top:10px; border:1px solid var(--line); border-radius:8px; position:relative; z-index:0; }
  .hint { font-size:.85rem; color:#4a5a70; margin:6px 0 0; }
  .linkbtn { display:block; text-align:center; text-decoration:none; }
  #leaveMsg, #adminMsg { margin-top:12px; padding:12px; border-radius:8px; display:none; line-height:1.5; }
  #leaveMsg.ok, #adminMsg.ok { display:block; background:#dff3ef; border:1px solid var(--in); }
  #leaveMsg.err, #adminMsg.err { display:block; background:#fde8e6; border:1px solid var(--err); color:var(--err); }
  #msg { margin-top:18px; padding:14px; border-radius:8px; display:none; line-height:1.5; }
  #msg.ok { display:block; background:#dff3ef; border:1px solid var(--in); }
  #msg.err { display:block; background:#fde8e6; border:1px solid var(--err); color:var(--err); }
</style>
</head>

  <h1>ບັນທຶກເວລາເຮັດວຽກ</h1>
  <p id="clock">--:--:--</p>
  <p id="date"></p>

  <label for="email">Gmail ຂອງທ່ານ</label>
  <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="name@gmail.com">

  <label for="location">ຈຸດເຮັດວຽກ</label>
  <select id="location"><option value="">ກຳລັງໂຫຼດລາຍຊື່ຈຸດ...</option></select>

  <label>ຮູບເຊວຟີ</label>
  <input id="shot" type="file" accept="image/*" capture="user">
  <button id="shotBtn" type="button">ຖ່າຍຮູບເຊວຟີ</button>
  <img id="preview" alt="ຮູບເຊວຟີທີ່ຖ່າຍ">

  <div class="actions">
    <button id="btnIn" type="button">Check-in</button>
    <button id="btnOut" type="button">Check-out</button>
  </div>
  <div class="actions second">
    <button id="btnLeave" type="button">ລາພັກວຽກ</button>
  </div>
  <div id="leave">
    <div class="cal-top">
      <button id="calPrev" class="calnav" type="button" aria-label="ເດືອນກ່ອນ">‹</button>
      <strong id="calTitle"></strong>
      <button id="calNext" class="calnav" type="button" aria-label="ເດືອນຕໍ່ໄປ">›</button>
    </div>
    <div id="calGrid" class="cal-grid"></div>
    <p id="leaveInfo"></p>
    <p class="legend">ແຕະວັນເພື່ອເລືອກ (ສີຂຽວ) · ສີຟ້າ = ລາໄວ້ແລ້ວ (ແຕະເພື່ອຍົກເລີກ) · ເລືອກມື້ທີ່ຜ່ານມາບໍ່ໄດ້</p>
    <button id="leaveSubmit" class="btn2" type="button">ຢືນຢັນລາພັກ</button>
    <button id="leaveClose" class="btn2" type="button">ປິດ</button>
    <div id="leaveMsg" role="status" aria-live="polite"></div>
  </div>
  <div id="msg" role="status" aria-live="polite"></div>

  <button id="adminToggle" type="button">⚙ ສຳລັບຜູ້ບໍລິຫານ (Admin)</button>
  <div id="admin">
    <div id="adminGate">
      <label for="adminCode" style="margin-top:0">ໃສ່ລະຫັດ Admin ເພື່ອເຂົ້າ</label>
      <input id="adminCode" type="password" autocomplete="off">
      <button id="adminEnter" class="btn2" type="button">ເຂົ້າສູ່ໂໝດ Admin</button>
    </div>
    <div id="adminBody" style="display:none">
      <button id="adminExit" class="btn2" type="button" style="margin-top:0">ອອກຈາກໂໝດ Admin</button>

      <h2>ພະນັກງານ</h2>
      <div id="empList"></div>
      <label for="empEmail">ເພີ່ມ Gmail ພະນັກງານ</label>
      <input id="empEmail" type="email" inputmode="email" autocapitalize="none" placeholder="name@gmail.com">
      <label for="empName">ຊື່ພະນັກງານ</label>
      <input id="empName" type="text">
      <button id="addEmp" class="btn2" type="button">ເພີ່ມພະນັກງານ</button>

      <h2>ຈຸດເຮັດວຽກ</h2>
      <div id="locList"></div>
      <div id="map"></div>
      <p class="hint">ແຕະໃສ່ແຜນທີ່ເພື່ອປັກຈຸດ (ວົງສີຂຽວ = ຈຸດທີ່ມີແລ້ວ, ວົງສີສົ້ມ = ຈຸດໃໝ່) ສະຫຼັບເປັນພາບດາວທຽມໄດ້ທີ່ມຸມຂວາເທິງ</p>
      <label for="gmapLink">ຫຼືວາງລິ້ງ / ພິກັດຈາກ Google Maps</label>
      <input id="gmapLink" type="text" placeholder="https://www.google.com/maps/... ຫຼື 17.9757, 102.6331">
      <button id="gmapParse" class="btn2" type="button">ອ່ານຄ່າຈາກ Google Maps</button>
      <a id="gmapOpen" class="btn2 linkbtn" href="https://www.google.com/maps" target="_blank" rel="noopener">ເປີດ Google Maps</a>
      <label for="locName">ຊື່ຈຸດ</label>
      <input id="locName" type="text">
      <div class="row">
        <div><label for="locLat">Lat</label><input id="locLat" type="text" inputmode="decimal"></div>
        <div><label for="locLng">Lng</label><input id="locLng" type="text" inputmode="decimal"></div>
      </div>
      <button id="useGps" class="btn2" type="button">ໃຊ້ຕຳແໜ່ງປັດຈຸບັນຂອງຂ້ອຍ</button>
      <label for="locRadius">ລັດສະໝີ (ແມັດ)</label>
      <input id="locRadius" type="text" inputmode="numeric" value="100">
      <button id="addLoc" class="btn2" type="button">ເພີ່ມຈຸດເຮັດວຽກ</button>
    </div>
    <div id="adminMsg" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
// ⚠️ ວາງ URL ຂອງ Web app (ລົງທ້າຍດ້ວຍ /exec) ຈາກ Apps Script Deploy
const API_URL = 'https://script.google.com/macros/s/AKfycbyreOA37PamrR_ALL48NVU7g1acU0UuwhrY3Cd2zj1el8DumV3dlEKinLvzw7KvQ3spsg/exec';

const $ = id => document.getElementById(id);
let photoData = '';

// ຈື່ Gmail ທີ່ເຄີຍໃສ່
try { $('email').value = localStorage.getItem('empEmail') || ''; } catch (e) {}

// ນາຬິກາ
function tick() {
  const n = new Date();
  $('clock').textContent = n.toLocaleTimeString('en-GB');
  $('date').textContent = n.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
tick(); setInterval(tick, 1000);


// ໂຫຼດລາຍຊື່ຈຸດເຮັດວຽກຈາກ Sheet
async function loadLocations() {
  const sel = $('location');
  try {
    const r = await fetch(API_URL);
    const d = await r.json();
    if (!d.ok || !d.locations.length) throw new Error('empty');
    sel.innerHTML = '<option value="">-- ເລືອກຈຸດເຮັດວຽກ --</option>' +
      d.locations.map(n => {
        const o = document.createElement('option');
        o.value = o.textContent = n;
        return o.outerHTML;
      }).join('');
    let last = '';
    try { last = localStorage.getItem('lastLoc') || ''; } catch (e) {}
    if (d.locations.includes(last)) sel.value = last;
  } catch (e) {
    sel.innerHTML = '<option value="">ໂຫຼດລາຍຊື່ຈຸດບໍ່ໄດ້ ກະລຸນາໂຫຼດໜ້າໃໝ່</option>';
  }
}
loadLocations();

$('shotBtn').onclick = () => $('shot').click();

// ຍ່ອຮູບກ່ອນສົ່ງ (ກວ້າງສຸດ 640px)
$('shot').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 640 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    photoData = c.toDataURL('image/jpeg', 0.6);
    $('preview').src = photoData; $('preview').style.display = 'block';
    $('shotBtn').textContent = 'ຖ່າຍໃໝ່';
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

function show(text, ok) {
  const m = $('msg'); m.textContent = text; m.className = ok ? 'ok' : 'err';
}

function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('ອຸປະກອນບໍ່ຮອງຮັບ GPS'));
    navigator.geolocation.getCurrentPosition(res,
      () => rej(new Error('ບໍ່ສາມາດອ່ານພິກັດ ກະລຸນາອະນຸຍາດການເຂົ້າເຖິງຕຳແໜ່ງ ແລະເປີດ GPS')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

function setBusy(b) { document.querySelectorAll('.actions button').forEach(x => x.disabled = b); }
async function submit(action) {
  const email = $('email').value.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('ກະລຸນາໃສ່ Gmail ໃຫ້ຖືກຕ້ອງ', false);
  if (!$('location').value) return show('ກະລຸນາເລືອກຈຸດເຮັດວຽກ', false);
  if (!photoData) return show('ກະລຸນາຖ່າຍຮູບເຊວຟີກ່ອນ', false);

  setBusy(true);
  show('ກຳລັງອ່ານພິກັດ ແລະບັນທຶກ...', true);
  try {
    const p = await getPos();
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({
      action, email, photo: photoData, location: $('location').value,
      lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy
    })});
    const d = await r.json();
    if (d.ok) {
      try { localStorage.setItem('lastLoc', $('location').value); localStorage.setItem('empEmail', email); } catch (e) {}
      let t = `${d.msg}\n${d.name} · ${d.location} · ${d.time} · ${d.status}`;
      if (d.hours !== '' && d.hours !== undefined) t += ` · ${d.hours} ຊົ່ວໂມງ`;
      show(t, true); $('msg').style.whiteSpace = 'pre-line';
      photoData = ''; $('preview').style.display = 'none'; $('shot').value = '';
      $('shotBtn').textContent = 'ຖ່າຍຮູບເຊວຟີ';
    } else { show(d.msg, false); }
  } catch (err) {
    show(err.message || 'ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກະລຸນາລອງໃໝ່', false);
  }
  setBusy(false);
}

// ===== ລາພັກວຽກ (ປະຕິທິນ) =====
const MON = ['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
const ymd = (y, m, d) => y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
const todayStr = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth(), n.getDate()); };
let cal = { y: 0, m: 0, info: null, sel: new Set() };

function leaveShow(text, ok) { const m = $('leaveMsg'); m.textContent = text; m.className = text ? (ok ? 'ok' : 'err') : ''; }
async function leaveCall(payload) {
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    return await r.json();
  } catch (e) { return { ok: false, msg: 'ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກະລຸນາລອງໃໝ່' }; }
}
function leaveEmail() {
  const email = $('email').value.trim().toLowerCase();
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? email : '';
}
function renderCal() {
  const { y, m, info, sel } = cal, today = todayStr(), booked = new Set(info.dates);
  $('calTitle').textContent = MON[m] + ' ' + y;
  const g = $('calGrid'); g.replaceChildren();
  ['ອາ', 'ຈ', 'ອ', 'ພ', 'ພຫ', 'ສຸ', 'ສ'].forEach(w => {
    const e = document.createElement('div'); e.className = 'wd'; e.textContent = w; g.appendChild(e);
  });
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) g.appendChild(document.createElement('div'));
  for (let d = 1; d <= days; d++) {
    const key = ymd(y, m, d), b = document.createElement('button');
    b.type = 'button'; b.textContent = d; b.className = 'day';
    if (booked.has(key)) b.classList.add('booked'); else if (sel.has(key)) b.classList.add('sel');
    if (key === today) b.classList.add('today');
    if (key < today) b.disabled = true;
    b.onclick = () => dayClick(key);
    g.appendChild(b);
  }
  const mk = ymd(y, m, 1).slice(0, 7), used = info.used[mk] || 0;
  const selN = [...sel].filter(x => x.startsWith(mk)).length;
  $('leaveInfo').textContent = `ເດືອນ${MON[m]}: ລາແລ້ວ ${used}/${info.quota} ມື້ · ເລືອກເພີ່ມ ${selN} ມື້ · ເຫຼືອສິດ ${Math.max(0, info.quota - used - selN)} ມື້` +
    (sel.size ? ` (ທັງໝົດທີ່ເລືອກ ${sel.size} ມື້)` : '');
}
async function dayClick(key) {
  if (cal.info.dates.includes(key)) {
    if (!confirm('ຍົກເລີກການລາວັນທີ ' + key + ' ແມ່ນບໍ?')) return;
    const d = await leaveCall({ action: 'leave_cancel', email: leaveEmail(), date: key });
    if (d.ok) { cal.info = d; leaveShow(d.msg, true); renderCal(); } else leaveShow(d.msg, false);
    return;
  }
  if (cal.sel.has(key)) cal.sel.delete(key);
  else {
    const mk = key.slice(0, 7), used = cal.info.used[mk] || 0;
    const selN = [...cal.sel].filter(x => x.startsWith(mk)).length;
    if (used + selN >= cal.info.quota) return leaveShow('ເດືອນນີ້ລາໄດ້ສູງສຸດ ' + cal.info.quota + ' ມື້', false);
    cal.sel.add(key);
  }
  leaveShow('', true); renderCal();
}
$('btnLeave').onclick = async function () {
  if (!leaveEmail()) return show('ກະລຸນາໃສ່ Gmail ກ່ອນເປີດປະຕິທິນລາພັກ', false);
  this.disabled = true; show('ກຳລັງໂຫຼດສິດລາພັກ...', true);
  const d = await leaveCall({ action: 'leave_info', email: leaveEmail() });
  this.disabled = false;
  if (!d.ok) return show(d.msg, false);
  $('msg').className = '';
  const n = new Date();
  cal = { y: n.getFullYear(), m: n.getMonth(), info: d, sel: new Set() };
  leaveShow('', true); $('leave').style.display = 'block'; renderCal();
  $('leave').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
$('calPrev').onclick = () => { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } renderCal(); };
$('calNext').onclick = () => { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } renderCal(); };
$('leaveClose').onclick = () => { $('leave').style.display = 'none'; };
$('leaveSubmit').onclick = async function () {
  const dates = [...cal.sel].sort();
  if (!dates.length) return leaveShow('ກະລຸນາເລືອກມື້ທີ່ຕ້ອງການລາໃນປະຕິທິນ', false);
  if (!confirm('ທ່ານຕ້ອງການລາພັກ ' + dates.length + ' ມື້ ແມ່ນບໍ?\n' + dates.join(', '))) return;
  if (!confirm('ຢືນຢັນອີກຄັ້ງ: ລາພັກແທ້ບໍ?\nວັນລາຈະຖືກຫັກຈາກສິດ ' + cal.info.quota + ' ມື້/ເດືອນ')) return;
  this.disabled = true; leaveShow('ກຳລັງບັນທຶກ...', true);
  const d = await leaveCall({ action: 'leave', email: leaveEmail(), dates });
  this.disabled = false;
  if (d.ok) { cal.info = d; cal.sel.clear(); leaveShow(d.msg, true); renderCal(); } else leaveShow(d.msg, false);
};

$('btnIn').onclick = () => submit('checkin');
$('btnOut').onclick = () => submit('checkout');

// ===== ສ່ວນ Admin (ຕ້ອງໃສ່ລະຫັດກ່ອນຈຶ່ງເຫັນລາຍລະອຽດ) =====
let adminCodeMem = '';
$('adminToggle').onclick = () => {
  const p = $('admin'); p.style.display = p.style.display === 'block' ? 'none' : 'block';
};
function adminShow(text, ok) { const m = $('adminMsg'); m.textContent = text; m.className = text ? (ok ? 'ok' : 'err') : ''; }
function adminLock() {
  adminCodeMem = ''; $('adminCode').value = '';
  $('adminBody').style.display = 'none'; $('adminGate').style.display = 'block';
}
async function adminCall(payload, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ adminCode: adminCodeMem }, payload)) });
    const d = await r.json();
    if (d.authFail) adminLock();
    return d;
  } catch (e) {
    return { ok: false, msg: 'ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກະລຸນາລອງໃໝ່' };
  } finally { if (btn) btn.disabled = false; }
}
function listRow(text, onDel) {
  const div = document.createElement('div'); div.className = 'item';
  const sp = document.createElement('span'); sp.textContent = text;
  const b = document.createElement('button'); b.type = 'button'; b.className = 'del'; b.textContent = 'ລຶບ'; b.onclick = onDel;
  div.append(sp, b); return div;
}
function renderLists(d) {
  const el = $('empList'), ll = $('locList');
  el.replaceChildren(); ll.replaceChildren();
  if (!d.employees.length) el.textContent = 'ຍັງບໍ່ມີພະນັກງານ';
  d.employees.forEach(e => el.appendChild(listRow(e.name + ' · ' + e.email, () => delEmp(e))));
  if (!d.locations.length) ll.textContent = 'ຍັງບໍ່ມີຈຸດເຮັດວຽກ';
  d.locations.forEach(l => ll.appendChild(listRow(l.name + ' · ' + l.radius + ' ມ.', () => delLoc(l))));
  initMap(d.locations);
}
// ----- ແຜນທີ່ເລືອກຈຸດ -----
let map = null, pinMarker = null, pinCircle = null, locLayer = null;
function initMap(locs) {
  if (!window.L) { $('map').textContent = 'ໂຫຼດແຜນທີ່ບໍ່ໄດ້ ກະລຸນາໃຊ້ການວາງລິ້ງ Google Maps ແທນ'; return; }
  if (!map) {
    const c = locs.length ? [locs[0].lat, locs[0].lng] : [17.9757, 102.6331];
    map = L.map('map').setView(c, 15);
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
    const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Esri' });
    osm.addTo(map); L.control.layers({ 'ແຜນທີ່': osm, 'ດາວທຽມ': sat }).addTo(map);
    locLayer = L.layerGroup().addTo(map);
    map.on('click', e => setPoint(e.latlng.lat, e.latlng.lng));
  }
  map.invalidateSize();
  locLayer.clearLayers();
  locs.forEach(l => L.circle([l.lat, l.lng], { radius: l.radius, color: '#057962', weight: 1, fillOpacity: .1 }).bindTooltip(l.name).addTo(locLayer));
}
function drawPin() {
  const lat = parseFloat($('locLat').value), lng = parseFloat($('locLng').value), r = parseFloat($('locRadius').value) || 100;
  if (!isFinite(lat) || !isFinite(lng)) return;
  $('gmapOpen').href = 'https://www.google.com/maps?q=' + lat + ',' + lng;
  if (!map) return;
  if (pinMarker) { pinMarker.setLatLng([lat, lng]); pinCircle.setLatLng([lat, lng]).setRadius(r); }
  else {
    pinCircle = L.circle([lat, lng], { radius: r, color: '#b26a00', weight: 2, fillOpacity: .15 }).addTo(map);
    pinMarker = L.circleMarker([lat, lng], { radius: 7, color: '#b26a00', fillColor: '#b26a00', fillOpacity: 1 }).addTo(map);
  }
}
function setPoint(lat, lng, fly) {
  $('locLat').value = lat.toFixed(6); $('locLng').value = lng.toFixed(6);
  drawPin();
  if (fly && map) map.setView([lat, lng], Math.max(map.getZoom(), 17));
}
['locLat', 'locLng', 'locRadius'].forEach(id => $(id).addEventListener('change', drawPin));
function parseGmaps(t) {
  try { t = decodeURIComponent(t.trim()); } catch (e) { t = t.trim(); }
  const pats = [/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),(-?\d+\.\d+)/,
    /[?&](?:q|ll|query)=(-?\d+\.\d+)[, +]+(-?\d+\.\d+)/, /^\s*(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)\s*$/];
  for (const p of pats) { const m = t.match(p); if (m) return [parseFloat(m[1]), parseFloat(m[2])]; }
  return null;
}
$('gmapParse').onclick = () => {
  const ll = parseGmaps($('gmapLink').value);
  if (!ll) return adminShow('ອ່ານພິກັດບໍ່ໄດ້ ກະລຸນາກ໋ອບລິ້ງເຕັມຈາກແຖບທີ່ຢູ່ (ລິ້ງສັ້ນ maps.app.goo.gl ໃຊ້ບໍ່ໄດ້) ຫຼືຄລິກຂວາ/ກົດຄ້າງໃນ Google Maps ແລ້ວກ໋ອບຕົວເລກພິກັດ', false);
  setPoint(ll[0], ll[1], true); adminShow('ອ່ານພິກັດແລ້ວ ກວດຈຸດໃນແຜນທີ່ ແລ້ວໃສ່ຊື່ຈຸດ', true);
};
async function refreshLists() { const d = await adminCall({ action: 'admin_list' }); if (d.ok) renderLists(d); }
$('adminEnter').onclick = async function () {
  const code = $('adminCode').value;
  if (!code) return adminShow('ກະລຸນາໃສ່ລະຫັດ Admin', false);
  adminCodeMem = code; adminShow('ກຳລັງກວດລະຫັດ...', true);
  const d = await adminCall({ action: 'admin_list' }, this);
  if (d.ok) {
    $('adminCode').value = ''; $('adminGate').style.display = 'none'; $('adminBody').style.display = 'block';
    adminShow('', true); renderLists(d);
  } else { adminCodeMem = ''; adminShow(d.msg, false); }
};
$('adminExit').onclick = () => { adminLock(); adminShow('', true); };
async function delEmp(e) {
  if (!confirm('ລຶບ ' + e.name + ' (' + e.email + ') ອອກຈາກລາຍຊື່ແມ່ນບໍ?')) return;
  const d = await adminCall({ action: 'admin_delete_employee', email: e.email });
  adminShow(d.msg, !!d.ok); if (d.ok) refreshLists();
}
async function delLoc(l) {
  if (!confirm('ລຶບຈຸດ "' + l.name + '" ອອກຈາກລາຍຊື່ແມ່ນບໍ?')) return;
  const d = await adminCall({ action: 'admin_delete_location', locName: l.name });
  adminShow(d.msg, !!d.ok); if (d.ok) { refreshLists(); loadLocations(); }
}
$('addEmp').onclick = async function () {
  const d = await adminCall({ action: 'admin_add_employee', email: $('empEmail').value, name: $('empName').value }, this);
  adminShow(d.msg, !!d.ok);
  if (d.ok) { $('empEmail').value = ''; $('empName').value = ''; refreshLists(); }
};
$('useGps').onclick = async function () {
  try {
    const p = await getPos();
    setPoint(p.coords.latitude, p.coords.longitude, true);
    adminShow('ໃສ່ພິກັດປັດຈຸບັນແລ້ວ (ຄວາມແມ່ນຍຳ ±' + Math.round(p.coords.accuracy) + ' ແມັດ)', true);
  } catch (e) { adminShow(e.message, false); }
};
$('addLoc').onclick = async function () {
  const d = await adminCall({
    action: 'admin_add_location', locName: $('locName').value,
    lat: $('locLat').value.trim(), lng: $('locLng').value.trim(), radius: $('locRadius').value.trim()
  }, this);
  adminShow(d.msg, !!d.ok);
  if (d.ok) {
    $('locName').value = ''; $('locLat').value = ''; $('locLng').value = ''; $('locRadius').value = '100'; $('gmapLink').value = '';
    if (pinMarker && map) { map.removeLayer(pinMarker); map.removeLayer(pinCircle); pinMarker = pinCircle = null; }
    refreshLists(); loadLocations();
  }
};

if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
